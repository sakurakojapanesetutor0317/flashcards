<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Minna no Nihongo Lesson 4</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">

<style>
*{ box-sizing:border-box; }
html,body{ margin:0; padding:0; }

:root{
--bg1:#ffe0f0;
--bg2:#e5d4ff;
--panel:#ffffff;
--ink:#4a1942;
--muted:#9b7ea8;
--accent:#ff6fa8;
--accent2:#a78bfa;
--correct:#3cb371;
--wrong:#ff5c5c;
--shadow: 0 8px 20px rgba(107,33,168,0.15);
}

body{
font-family:'Quicksand',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
min-height:100vh;
background:linear-gradient(160deg, var(--bg1), var(--bg2));
display:flex;
flex-direction:column;
align-items:center;
padding: 20px 12px 60px;
margin:0;
color:var(--ink);
}

#app{
    width:100%;
    max-width:480px;
}

.homebar{
    position:sticky;
    top:10px;
    z-index:20;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:8px;
    margin-bottom:10px;
    flex-wrap:wrap;
}
.home-btn{
    display:inline-flex;
    align-items:center;
    gap:6px;
    background:var(--panel);
    color:var(--ink);
    text-decoration:none;
    font-weight:800;
    font-size:0.85rem;
    padding:9px 16px;
    border-radius:999px;
    box-shadow:var(--shadow);
    border:2px solid rgba(0,0,0,0.06);
    transition:transform .08s ease;
}
.home-btn:hover{ transform:translateY(-2px); }

.user-pill{
    display:inline-flex;
    align-items:center;
    gap:6px;
    background:var(--panel);
    color:var(--ink);
    font-size:0.8rem;
    font-weight:700;
    padding:8px 14px;
    border-radius:999px;
    box-shadow:var(--shadow);
}
.switch-user{
    color:var(--accent2);
    text-decoration:underline;
    cursor:pointer;
    font-weight:700;
}

h1 {
    text-align:center;
    margin: 6px 0 2px;
    font-family:'Baloo 2', 'Quicksand', sans-serif;
    font-weight:800;
    font-size: 2.1rem;
    letter-spacing:0.01em;
    background:linear-gradient(135deg, var(--accent), var(--accent2));
    -webkit-background-clip:text;
    background-clip:text;
    -webkit-text-fill-color:transparent;
    color:transparent;
    display:inline-block;
    width:100%;
}
.sub{
    text-align:center;
    color:var(--muted);
    font-size:0.85rem;
    font-weight:600;
    letter-spacing:0.03em;
    margin-bottom:16px;
}

/* ---------- Screens (login / menu) ---------- */
.screen{
    background:var(--panel);
    border-radius:24px;
    box-shadow:var(--shadow);
    padding: 26px 22px;
    width: 100%;
    margin: 0 auto 18px auto;
    text-align: center;
}
.screen h2{
    color: var(--ink);
    margin-top: 0;
    font-family:'Baloo 2', 'Quicksand', sans-serif;
    font-weight:700;
    font-size:1.4rem;
}
.screen p{
    color:var(--muted);
    font-size:0.9rem;
}
.screen input[type="text"]{
    width: 100%;
    box-sizing: border-box;
    padding: 13px 16px;
    font-size: 17px;
    border: 2px solid #f4d9ef;
    border-radius: 14px;
    margin: 14px 0;
    text-align: center;
    font-family: inherit;
    background:#fff6fb;
    color:var(--ink);
}
.wrong-count{
    font-size: 13px;
    color:var(--muted);
    font-weight:700;
    margin-top: 2px;
    margin-bottom: 14px;
}

/* ---------- Buttons ---------- */
button {
    padding: 13px 24px;
    font-size: 16px;
    font-weight: 800;
    border: none;
    border-radius: 16px;
    cursor: pointer;
    font-family:inherit;
    transition: transform 0.08s ease;
}
.primary-btn, #loginBtn, .menu-btn, .play-again{
    background:linear-gradient(135deg, var(--accent), var(--accent2));
    color:white;
    box-shadow:var(--shadow);
    width:100%;
    display:block;
    margin-top:12px;
}
.primary-btn:active, #loginBtn:active, .menu-btn:active, .play-again:active{
    transform:translateY(1px);
}
.secondary-btn, .back-menu{
    background:var(--panel);
    color:var(--ink);
    border:2px solid #f4d9ef;
    width:100%;
    display:block;
    margin-top:12px;
}
.secondary-btn:hover, .back-menu:hover{
    border-color:var(--accent);
}
.play-again, .back-menu{
    display:none;
    margin-top:16px;
}
.result-buttons{
    display:flex;
    flex-direction:column;
    gap:0;
}

/* ---------- Meta row (score / progress pills) ---------- */
.meta-row{
    display:flex;
    justify-content:center;
    gap:10px;
    flex-wrap:wrap;
    margin-bottom:16px;
}
.pill{
    display:flex;
    justify-content:center;
    align-items:center;
    gap:6px;
    background:var(--panel);
    border-radius:999px;
    padding:8px 16px;
    box-shadow:var(--shadow);
    font-weight:800;
    font-size:0.9rem;
}
.pill .star{ color:#ffb703; }

/* ---------- Controls ---------- */
.controls {
    background:var(--panel);
    border-radius:16px;
    box-shadow:var(--shadow);
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    margin: 0 auto 14px auto;
    padding:12px 16px;
    width: fit-content;
    font-size:0.85rem;
    font-weight:700;
}
.controls label {
    display: flex;
    align-items: center;
    gap: 8px;
    text-align: left;
    padding:3px 0;
}

/* ---------- Quiz card ---------- */
.quiz-container{
    width:100%;
    margin:0 auto;
}

.card {
    position:relative;
    background:var(--panel);
    border-radius: 24px;
    box-shadow:var(--shadow);
    padding: 22px 18px 18px;
    width: 100%;
    margin: 0 auto 14px auto;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap:6px;
}

.save-toggle{
    position:absolute;
    top:14px;
    right:14px;
    width:38px;
    height:38px;
    padding:0;
    border-radius:50%;
    border:2px solid #f4d9ef;
    background:#fff6fb;
    color:var(--muted);
    font-size:18px;
    line-height:1;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    transition:transform .12s ease, background .15s ease, border-color .15s ease, color .15s ease;
}
.save-toggle:hover{ transform:scale(1.08); }
.save-toggle.saved{
    background:#fff2c7;
    border-color:#ffb703;
    color:#c98a00;
    animation:bounce .4s;
}

.saved-item{
    display:flex;
    align-items:center;
    gap:10px;
    background:#fff6fb;
    border:2px solid #f4d9ef;
    border-radius:14px;
    padding:10px 12px;
    margin-bottom:8px;
    text-align:left;
}
.saved-item .emoji{ font-size:24px; }
.saved-item .info{ flex:1; min-width:0; }
.saved-item .word{ font-weight:800; font-size:1rem; }
.saved-item .meaning{ font-size:0.82rem; color:var(--muted); }
.saved-item .remove-btn{
    width:30px;
    height:30px;
    padding:0;
    border-radius:50%;
    background:#ffe9e9;
    color:#a12b2b;
    font-size:14px;
    font-weight:800;
    border:none;
    cursor:pointer;
    flex-shrink:0;
}
.saved-empty{
    color:var(--muted);
    font-size:0.9rem;
    padding:10px 0 4px;
}

#emojiDisplay {
    font-size: 44px;
    line-height:1;
}

#question {
    font-size: 32px;
    font-weight: 800;
    text-align:center;
}

.qlabel{
    display:inline-block;
    background:var(--accent);
    color:white;
    font-weight:800;
    padding:4px 14px;
    border-radius:999px;
    font-size:0.78rem;
}

#exDisplay{
    font-size:12px;
    color:var(--muted);
    font-weight:600;
}

#romaji {
    border-top: 2px solid #f4d9ef;
    padding-top: 10px;
    margin-top: 8px;
    width: 100%;
    font-size:16px;
    font-weight:600;
    letter-spacing:1px;
    color:var(--muted);
    text-align:center;
}

/* Ruby (furigana) color */
ruby rt {
    color: var(--accent2);
    font-size: 0.5em;
    font-weight: bold;
}

#answers{
    width:100%;
    display:flex;
    flex-direction:column;
    gap:10px;
    margin-top:10px;
}

.answer {
    width:100%;
    box-sizing:border-box;
    padding: 14px 12px;
    font-size: 16px;
    font-weight: 800;
    border: 2px solid #f4d9ef;
    border-radius: 14px;
    text-align: center;
    background: #fff6fb;
    color:var(--ink);
    cursor: pointer;
    transition: transform .08s ease, background .15s ease, border-color .15s ease;
}

.answer:hover{
    transform:translateY(-2px);
    border-color:var(--accent);
}

.correct{
    background:#e4f8ec;
    border-color:var(--correct);
    color:#1d6b3f;
    animation:bounce .45s;
}

.wrong{
    background:#ffe9e9;
    border-color:var(--wrong);
    color:#a12b2b;
    animation:shake .45s;
}

#message{
    height:26px;
    margin-top:4px;
    font-size:18px;
    font-weight:800;
    text-align: center;
}

/* ---------- Animation ---------- */

@keyframes bounce{
0%{transform:scale(1);}
35%{transform:scale(1.05);}
60%{transform:scale(.97);}
100%{transform:scale(1);}
}

@keyframes shake{
0%,100%{transform:translateX(0);}
20%{transform:translateX(-6px);}
40%{transform:translateX(6px);}
60%{transform:translateX(-6px);}
80%{transform:translateX(6px);}
}

@keyframes fadeIn{
from{ opacity:0; transform:translateY(15px); }
to{ opacity:1; transform:translateY(0); }
}

/* ---------- Result ---------- */
#result{
    display:none;
    background:var(--panel);
    border-radius:24px;
    box-shadow:var(--shadow);
    text-align:center;
    padding:24px 20px;
    margin-top:6px;
    animation:fadeIn .5s;
}

#stars {
    font-size: 46px;
    margin: 10px 0;
    display: inline-block;
}

#result h2{
    font-family:'Baloo 2', 'Quicksand', sans-serif;
    font-weight:700;
    font-size:1.5rem;
    margin:4px 0 10px;
    color:var(--ink);
}

#result p{
    font-size:1.1rem;
    font-weight:800;
    color:var(--muted);
}

.hint{
    display:none;
    background:#fff6fb;
    border:2px solid #f4d9ef;
    border-radius:14px;
    padding:10px 14px;
    margin:14px 0 0;
    font-size:0.85rem;
    font-weight:600;
    color:var(--ink);
    line-height:1.4;
}

/* ---------- Flashcard ---------- */
.flip-card{ cursor:pointer; min-height:230px; justify-content:center; user-select:none; }
.flip-card.flipping{ animation:flip .35s ease; }
@keyframes flip{
0%{ transform:rotateY(0); }
50%{ transform:rotateY(90deg); }
100%{ transform:rotateY(0); }
}
#question.back-side{ font-size:26px; line-height:1.35; }
.qlabel.back-label{ background:var(--accent2); }
.tap-hint{ font-size:0.8rem; font-weight:700; color:var(--accent); margin-top:8px; }
.judge-row{ display:none; gap:10px; width:100%; }
.judge-row button{ flex:1; padding:13px 10px; }
.know-btn{ background:linear-gradient(135deg, var(--accent), var(--accent2)); color:white; box-shadow:var(--shadow); }
.learn-btn{ background:var(--panel); color:var(--ink); border:2px solid #f4d9ef; }
.learn-btn:hover{ border-color:var(--accent); }
#flipBtn{ margin-top:0; }
</style>
</head>

<body>
<div id="app">

<div class="homebar">
    <a class="home-btn" href="https://sakurakojapanesetutor0317.github.io/wordgame/index.html">🏠 Back to Home</a>
    <div id="userBar" class="user-pill" style="display:none;">
        <span id="userBarName"></span>　<span class="switch-user" onclick="showLogin()">Switch User</span>
    </div>
</div>

<h1>🌟 Lesson 4 Flashcards</h1>
<div class="sub">Minna no Nihongo Lesson 4 — tap the card to see the meaning</div>

<div id="loginScreen" class="screen">
    <h2>Welcome! 🌸</h2>
    <p>Enter your name (or ID) to begin</p>
    <input type="text" id="userNameInput" placeholder="e.g. Taro">
    <button id="loginBtn" onclick="login()">Start</button>
</div>

<div id="menuScreen" class="screen" style="display:none;">
    <h2 id="menuGreeting">Hi there!</h2>
    <div class="wrong-count" id="wrongCountDisplay"></div>
    <div class="wrong-count" id="savedCountDisplay"></div>
    <button class="menu-btn" onclick="start()">🆕 Start All Cards</button>
    <button class="menu-btn" onclick="startReview()">🔁 Review "Still Learning" Cards</button>
    <button class="secondary-btn" onclick="showSavedWords()">⭐ My Saved Words</button>
</div>

<div id="savedScreen" class="screen" style="display:none;">
    <h2>⭐ My Saved Words</h2>
    <div id="savedList"></div>
    <button class="secondary-btn" onclick="backToMenu()">Back to Menu</button>
</div>

<div class="meta-row" id="metaRow" style="display:none;">
    <div class="pill"><span class="star">⭐</span> Known <span id="scoreCorrect">0</span> / <span id="scoreAttempted">0</span></div>
    <div class="pill">📝 Card <span id="qNum">1</span> / <span id="qTotal">1</span></div>
</div>

<div class="controls" id="controlsArea" style="display:none;">
<label>
    <input type="checkbox" id="mode" onchange="updateView()">
    Kanji + Furigana Mode
</label>
<label>
    <input type="checkbox" id="romajiMode" checked onchange="updateView()">
    Show Romaji
</label>
<label>
<input type="checkbox" id="soundMode" checked>
Sound Effects
</label>
</div>

<div class="quiz-container" id="quizContainer" style="display:none;">
<div class="card flip-card" id="card" onclick="flipCard()">
    <button class="save-toggle" id="saveToggle" onclick="event.stopPropagation(); toggleSave()" title="Save this word">☆</button>
    <div id="sideLabel" class="qlabel">Japanese</div>
    <div id="question"></div>
    <div id="romaji"></div>
    <div class="tap-hint" id="tapHint">👆 Tap to flip</div>
</div>

    <div id="answers">
        <button class="secondary-btn" id="flipBtn" onclick="flipCard()">🔄 Flip Card</button>
        <div class="judge-row" id="judgeRow">
            <button class="learn-btn" onclick="judge(false)">🔁 Still learning</button>
            <button class="know-btn" onclick="judge(true)">✅ I knew it!</button>
        </div>
    </div>
</div>

<div id="message"></div>

<div id="result">
    <h2>🎉 Great Job! 🎉</h2>
    <div id="stars"></div>
    <p id="finalScore"></p>
    <p class="hint" id="reviewHint"></p>
    <div class="result-buttons">
        <button class="play-again" onclick="restart()">Play Again</button>
        <button class="back-menu" onclick="backToMenu()">Back to Menu</button>
    </div>
</div>

</div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getFirestore, doc, setDoc, getDocs, collection, query, where, serverTimestamp, increment
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

/* =====================================================
SETUP INSTRUCTIONS — do this before the file will work

1. Go to https://console.firebase.google.com/ and sign in with a Google account
2. Click "Add project" and create a new project (free, no credit card required)
3. In the left menu, go to "Build" -> "Firestore Database" -> "Create database"
   -> pick any location -> choose "Start in test mode"
4. Click the gear icon -> "Project settings" -> scroll to "Your apps" ->
   click the "</>" (Add web app) icon -> give it any nickname and register it
5. Copy the firebaseConfig object shown there and paste it into firebaseConfig below
6. Open the "Rules" tab in Firestore and replace the rules with the following,
   then click "Publish":

   rules_version = '2';
   service cloud.firestore {
     match /databases/{database}/documents {
       match /users/{userId}/{document=**} {
         allow read, write: if true;
       }
     }
   }

   Note: this is a lightweight "name only" login with no password protection.
   Anyone who types someone else's name can see/edit that person's data, so
   this is meant for a small, trusted group (a few to a few dozen people),
   not for public use.
===================================================== */

const firebaseConfig = {
  apiKey: "AIzaSyCjsrPYvaH-rAlRRFdf6weu9vb6ohhO4wI",
  authDomain: "sakurako-japanese.firebaseapp.com",
  projectId: "sakurako-japanese",
  storageBucket: "sakurako-japanese.firebasestorage.app",
  messagingSenderId: "672494400133",
  appId: "1:672494400133:web:3f744c46929fb502376fec"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

// ===== Sound =====

const audio = new (window.AudioContext || window.webkitAudioContext)();

function playTone(freq,duration){
  const osc=audio.createOscillator();
  const gain=audio.createGain();
  osc.connect(gain);
  gain.connect(audio.destination);
  osc.frequency.value=freq;
  osc.type="triangle";
  gain.gain.value=0.15;
  osc.start();
  gain.gain.exponentialRampToValueAtTime(0.0001, audio.currentTime+duration);
  osc.stop(audio.currentTime+duration);
}

function correctSound(){
  if(!document.getElementById("soundMode").checked) return;
  playTone(700,.08);
  setTimeout(()=>{ playTone(900,.12); },90);
}

function wrongSound(){
  if(!document.getElementById("soundMode").checked) return;
  playTone(180,.25);
}
// ===== Card data (Minna no Nihongo Lesson 4) =====
// k: kanji + furigana, r: kana, m: romaji, a: English meaning
const data = [
    { k: "<ruby>朝<rt>あさ</rt></ruby>", r: "あさ", m: "a sa", a: "morning" },
    { k: "<ruby>昼<rt>ひる</rt></ruby>", r: "ひる", m: "hi ru", a: "daytime, noon" },
    { k: "<ruby>晩<rt>ばん</rt></ruby> / <ruby>夜<rt>よる</rt></ruby>", r: "ばん / よる", m: "ba n / yo ru", a: "night" },
    { k: "<ruby>郵便局<rt>ゆうびんきょく</rt></ruby>", r: "ゆうびんきょく", m: "yu u bi n kyo ku", a: "post office" },
    { k: "<ruby>図書館<rt>としょかん</rt></ruby>", r: "としょかん", m: "to sho ka n", a: "library" },
    { k: "<ruby>銀行<rt>ぎんこう</rt></ruby>", r: "ぎんこう", m: "gi n ko u", a: "bank" },
    { k: "<ruby>美術館<rt>びじゅつかん</rt></ruby>", r: "びじゅつかん", m: "bi ju tsu ka n", a: "art museum" },
    { k: "デパート", r: "デパート", m: "de pa - to", a: "department store" },
    { k: "<ruby>勉強<rt>べんきょう</rt></ruby>します", r: "べんきょうします", m: "be n kyo u shi ma su", a: "study" },
    { k: "<ruby>終<rt>お</rt></ruby>わります", r: "おわります", m: "o wa ri ma su", a: "finish" },
    { k: "<ruby>起<rt>お</rt></ruby>きます", r: "おきます", m: "o ki ma su", a: "wake up" },
    { k: "<ruby>寝<rt>ね</rt></ruby>ます", r: "ねます", m: "ne ma su", a: "sleep" },
    { k: "<ruby>休<rt>やす</rt></ruby>みます", r: "やすみます", m: "ya su mi ma su", a: "take a rest, take a holiday" },
    { k: "<ruby>働<rt>はたら</rt></ruby>きます", r: "はたらきます", m: "ha ta ra ki ma su", a: "work" },
    { k: "<ruby>月曜日<rt>げつようび</rt></ruby>", r: "げつようび", m: "ge tsu yo u bi", a: "Monday" },
    { k: "<ruby>火曜日<rt>かようび</rt></ruby>", r: "かようび", m: "ka yo u bi", a: "Tuesday" },
    { k: "<ruby>水曜日<rt>すいようび</rt></ruby>", r: "すいようび", m: "su i yo u bi", a: "Wednesday" },
    { k: "<ruby>木曜日<rt>もくようび</rt></ruby>", r: "もくようび", m: "mo ku yo u bi", a: "Thursday" },
    { k: "<ruby>金曜日<rt>きんようび</rt></ruby>", r: "きんようび", m: "ki n yo u bi", a: "Friday" },
    { k: "<ruby>土曜日<rt>どようび</rt></ruby>", r: "どようび", m: "do yo u bi", a: "Saturday" },
    { k: "<ruby>日曜日<rt>にちようび</rt></ruby>", r: "にちようび", m: "ni chi yo u bi", a: "Sunday" },
    { k: "<ruby>何曜日<rt>なんようび</rt></ruby>", r: "なんようび", m: "na n yo u bi", a: "What day of the week" }
    ];
    
   
    let index = 0;
    let isFront = true;

function updateDisplay() {
    const isKanjiMode = document.getElementById('modeToggle').checked;
    const wordDiv = document.getElementById('word');
    
    if (isFront) {
        if (isKanjiMode) {
            // ここでHTMLタグとしてそのまま出力します
            wordDiv.innerHTML = data[index].k;
        } else {
            wordDiv.innerHTML = data[index].r;
        }
        document.getElementById('romaji').innerText = data[index].m;
    } else {
        wordDiv.innerHTML = data[index].a;
        document.getElementById('romaji').innerText = "";
        }
    }

    function flipCard() { isFront = !isFront; updateDisplay(); }
    function nextCard() { index = (index + 1) % data.length; isFront = true; updateDisplay(); }

    updateDisplay();
</script>
</body>
</html>
